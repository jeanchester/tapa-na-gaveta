# Publica o site no GitHub Pages a cada mudança na branch principal (opção de hospedagem; ver
# README, "Publicar"). Defina a variável do repositório SITE_URL (ex.: https://tapanagaveta.com.br).
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  # os dados atualizados pelo robô não disparam o push acima (commits do GITHUB_TOKEN não
  # disparam outros fluxos): republica quando a atualização de dados termina
  workflow_run:
    workflows: ['Atualizar dados de reserva']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages-publicar, cancel-in-progress: true }   # nome trocado em 11/11: execuções presas no grupo antigo travavam a fila
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/testar-core.js && node tools/testar-milhao.js
      # ADSENSE_ID (variável do repositório, ex.: ca-pub-1234567890123456): vazia = site sem anúncios
      - run: node tools/build.js --release --site "${{ vars.SITE_URL || 'https://jeanchester.github.io/tapa-na-gaveta' }}" --adsense "${{ vars.ADSENSE_ID }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
