<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <title>Simulador do Brasileirão 2026 · Tapa na Gaveta</title>
  <meta name="description" content="Simule os jogos que faltam do Brasileirão 2026, veja as chances de título, Libertadores e rebaixamento do seu time e compartilhe a tabela final.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tapa na Gaveta">
  <meta property="og:title" content="Simulador do Brasileirão 2026">
  <meta property="og:description" content="Chute os placares que faltam e veja como termina a tabela.">
  <meta property="og:image" content="midia/og/simulador.png">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" href="app/icones/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/woff2" href="shared/fonts/manrope-latin-700-normal.woff2" crossorigin>
  <link rel="stylesheet" href="app/app.css">
  <script>
    // tema antes de desenhar a página (sem piscar claro → escuro)
    try { var t = localStorage.getItem('tng.tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* sem armazenamento */ }
  </script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="head" id="topo"></header>
  <main id="conteudo" class="wrap" tabindex="-1"></main>
  <footer class="foot" id="rodape"></footer>
  <div id="aviso" role="status" aria-live="polite"></div>
  <script>
    // faixa vermelha de erro: só no desenvolvimento (o tools/build.js --release grava TNG_RELEASE antes)
    window.onerror = function (message, source, lineno, colno, error) {
      if (window.TNG_RELEASE) return false;
      var d = document.createElement('pre');
      d.className = 'dev-error';
      d.textContent = message + '\n' + (source || '') + ':' + lineno + '\n' + ((error && error.stack) || '');
      document.body.appendChild(d);
      return false;
    };
  </script>
  <script src="app/app.js"></script>
</body>
</html>
